name: Build & Publish Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test --nologo

      - name: Publish (framework-dependent, linux-x64)
        run: |
          dotnet publish Main/Main.csproj \
            -c Release -r linux-x64 --self-contained false -o publish-linux

      - name: Package binaries
        run: |
          mkdir -p dist
          tar -czf dist/BlueArchiveWS-linux-x64.tar.gz -C publish-linux .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueArchiveWS-linux-x64
          path: dist/

      - name: Delete previous 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Create/upload 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest dist/* \
            --title "Latest build (${{ github.sha }})" \
            --generate-notes --latest
