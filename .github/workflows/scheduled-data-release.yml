name: Scheduled Data Release

on:
  schedule:
    - cron: '0 0 8 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish (framework-dependent, linux-x64)
        run: |
          dotnet publish Main/Main.csproj \
            -c Release -r linux-x64 --self-contained false -o publish-linux

      - name: Restore previous data snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/Documents/BlueArchiveWS
          if gh release view data >/dev/null 2>&1; then
            gh release download data --pattern 'BlueArchiveWS-data.tar.gz' --dir restore --clobber
            tar -xzf restore/BlueArchiveWS-data.tar.gz -C ~/Documents/BlueArchiveWS
            echo "Restored previous snapshot."
          else
            echo "No previous data release; starting fresh."
          fi

      - name: Run scraper in quiet mode
        run: dotnet ./publish-linux/Main.dll --yes
        timeout-minutes: 150

      - name: Package BlueArchiveWS folder
        run: |
          mkdir -p dist
          tar -czf dist/BlueArchiveWS-data.tar.gz -C ~/Documents/BlueArchiveWS .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueArchiveWS-data
          path: dist/

      - name: Delete previous 'data' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete data --yes --cleanup-tag || true

      - name: Create/upload 'data' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create data dist/* \
            --title "BlueArchiveWS data snapshot" \
            --notes "Scheduled data snapshot." --latest
